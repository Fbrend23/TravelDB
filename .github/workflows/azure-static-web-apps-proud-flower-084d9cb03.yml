name: Build and deploy to Azure (front)

on:
  push:
    branches:
      - azure-deploy
  workflow_dispatch:
jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
       id-token: write
       contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build And Deploy Frontend
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Utilisation du nouveau secret généré par Azure
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_FLOWER_084D9CB03 }}
          action: "upload"
          app_location: "./frontend" 
          output_location: "dist" 
        env:
          # Injection de l'URL de l'API pour que Vue.js puisse communiquer avec le backend
          VITE_API_URL: "${{ secrets.API_URL_AZURE }}"